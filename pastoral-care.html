<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pastoral Care | Redeemer Greensboro</title><meta name="description" content="Request a pastoral conversation, visit, support, or care from Episcopal Church of the Redeemer."><link rel="stylesheet" href="assets/css/site.css"><script defer src="assets/js/config.js"></script><script defer src="assets/js/site.js"></script><script defer src="assets/js/forms.js"></script></head><body data-page="care"><a class="skip-link" href="#main">Skip to content</a><div data-site-header></div><main id="main"><section class="page-hero"><div class="shell reveal"><p class="eyebrow gold">Pastoral care</p><h1>Ask for care.</h1><p>Request a conversation, visit, sacramental support, or accompaniment through a difficult season.</p></div></section><section class="section"><div class="shell form-wrap"><h2>Pastoral care request.</h2><form data-submission-form data-form-type="pastoral_care" class="form-grid"><div class="field"><label for="pc-name">Name</label><input id="pc-name" name="name" required></div><div class="field"><label for="pc-contact">Contact information</label><input id="pc-contact" name="contact" required></div><div class="field"><label for="pc-type">Type of care</label><select id="pc-type" name="care_type" required><option value="">Choose one</option><option>Pastoral conversation</option><option>Hospital or home visit</option><option>Grief support</option><option>Prayer or sacramental support</option><option>Family support</option><option>Other</option></select></div><div class="field"><label for="pc-method">Preferred contact method</label><select id="pc-method" name="contact_method" required><option>Phone</option><option>Email</option><option>Text</option></select></div><div class="field"><label for="pc-time">Best time to contact</label><input id="pc-time" name="best_time" required></div><div class="field"><label for="pc-emergency">Emergency?</label><select id="pc-emergency" name="emergency" required><option>No</option><option>Yes</option></select></div><div class="field full"><label for="pc-details">Details</label><textarea id="pc-details" name="details" rows="6" required></textarea></div><div class="hp-field"><input name="website"></div><div class="field full"><button class="button button-primary" type="submit" data-label="Request care">Request care</button><p class="note">This form is not continuously monitored. For immediate danger call 911; for a mental health crisis in the U.S., call or text 988.</p><div class="form-status"></div></div></form></div></section></main><div data-site-footer></div></body></html>
