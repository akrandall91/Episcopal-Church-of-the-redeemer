<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Sign In | Episcopal Church of the Redeemer</title><meta name="description" content="Secure member sign in for Episcopal Church of the Redeemer."><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="assets/css/site.css"><script defer src="assets/js/config.js"></script><script defer src="assets/js/site.js"></script><script defer src="assets/js/member-portal.js"></script></head>
<body data-page="members" data-member-view="login"><a class="skip-link" href="#main">Skip to content</a><div data-site-header></div><main id="main" class="member-shell"><div class="shell member-login-layout"><section><p class="eyebrow gold">Redeemer members</p><h1>A place to stay connected.</h1><p class="lede">Sign in to view parish announcements, upcoming gatherings, member resources, and your profile.</p><p class="member-security-note">Access is invitation-only. Contact the church office if you need an account or help signing in.</p></section><section class="member-auth-card"><h2>Member sign in</h2><form data-member-login class="form-grid"><div class="field full"><label for="member-email">Email</label><input id="member-email" name="email" type="email" autocomplete="email" required></div><div class="field full"><label for="member-password">Password</label><input id="member-password" name="password" type="password" autocomplete="current-password" required></div><div class="field full"><button class="button button-primary" type="submit">Sign in</button><div class="form-status" data-member-status></div></div></form><button class="member-text-button" type="button" data-member-reset>Send a password-reset email</button></section></div></main><div data-site-footer></div></body></html>
