<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Episcopal Church of the Redeemer</title><meta name="description" content="Contact Episcopal Church of the Redeemer at 901 E Friendly Ave in Greensboro, North Carolina."><link rel="stylesheet" href="assets/css/site.css"><script defer src="assets/js/config.js"></script><script defer src="assets/js/site.js"></script><script defer src="assets/js/forms.js"></script></head><body data-page="contact"><a class="skip-link" href="#main">Skip to content</a><div data-site-header></div><main id="main"><section class="page-hero"><div class="shell reveal"><p class="eyebrow gold">Contact</p><h1>Start a conversation.</h1><p>Questions, stories, practical needs, and possibilities for connection are welcome here.</p></div></section><section class="section"><div class="shell content-grid"><aside class="info-band"><h2>Church office</h2><p>901 E Friendly Ave<br>Greensboro, NC 27401</p><p><a href="tel:+13362750033">(336) 275-0033</a></p><p>Monday–Friday<br>9:00 AM–3:00 PM</p></aside><div class="form-wrap"><h2>Send a message.</h2><form data-submission-form data-form-type="contact" class="form-grid"><div class="field"><label for="co-name">Name</label><input id="co-name" name="name" required></div><div class="field"><label for="co-email">Email</label><input id="co-email" name="email" type="email" required></div><div class="field"><label for="co-phone">Phone <small>(optional)</small></label><input id="co-phone" name="phone" type="tel"></div><div class="field"><label for="co-reason">Reason for contact</label><select id="co-reason" name="reason" required><option value="">Choose one</option><option>General question</option><option>Visit</option><option>Worship</option><option>Share a memory</option><option>Giving</option><option>Other</option></select></div><div class="field full"><label for="co-message">Message</label><textarea id="co-message" name="message" rows="6" required></textarea></div><div class="field full"><label><input type="checkbox" name="consent" value="yes" required> I consent to contact about this message.</label></div><div class="hp-field"><input name="website"></div><div class="field full"><button class="button button-primary" type="submit" data-label="Send message">Send message</button><div class="form-status"></div></div></form></div></div></section></main><div data-site-footer></div></body></html>
