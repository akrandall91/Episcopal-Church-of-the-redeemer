<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volunteer | Serve With Redeemer</title><meta name="description" content="Offer your time, skills, hospitality, transportation, mentorship, or ministry service at Redeemer."><link rel="stylesheet" href="assets/css/site.css"><script defer src="assets/js/config.js"></script><script defer src="assets/js/site.js"></script><script defer src="assets/js/forms.js"></script></head><body data-page="volunteer"><a class="skip-link" href="#main">Skip to content</a><div data-site-header></div><main id="main">
<section class="page-hero"><div class="shell reveal"><p class="eyebrow gold">Volunteer</p><h1>Bring what<br><em>you carry.</em></h1><p>Offer your time, skills, care, and presence to the common life of Redeemer.</p></div></section>
<section class="section"><div class="shell form-wrap"><p class="eyebrow">Serve with us</p><h2>Volunteer interest.</h2><form data-submission-form data-form-type="volunteer" class="form-grid"><div class="field"><label for="vo-name">Name</label><input id="vo-name" name="name" required></div><div class="field"><label for="vo-email">Email</label><input id="vo-email" name="email" type="email" required></div><div class="field"><label for="vo-phone">Phone</label><input id="vo-phone" name="phone" type="tel" required></div><fieldset class="fieldset"><legend>Areas of interest</legend><div class="choices"><label><input type="checkbox" name="areas" value="worship"> Worship</label><label><input type="checkbox" name="areas" value="hospitality"> Hospitality</label><label><input type="checkbox" name="areas" value="transportation"> Transportation</label><label><input type="checkbox" name="areas" value="mentoring"> Mentorship</label><label><input type="checkbox" name="areas" value="care"> Community care</label><label><input type="checkbox" name="areas" value="campaign"> Campaign</label><label><input type="checkbox" name="areas" value="media"> Media/communications</label></div></fieldset><div class="field"><label for="vo-availability">Availability</label><input id="vo-availability" name="availability" required></div><div class="field"><label for="vo-skills">Skills</label><input id="vo-skills" name="skills"></div><div class="field full"><label for="vo-check">Background check</label><select id="vo-check" name="background_check"><option>Not sure / discuss with me</option><option>I understand one may be required</option><option>I have a current check</option></select></div><div class="field full"><label for="vo-notes">Notes</label><textarea id="vo-notes" name="notes" rows="4"></textarea></div><div class="field full"><label><input type="checkbox" name="consent" value="yes" required> I consent to contact about volunteer opportunities.</label></div><div class="hp-field"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><div class="field full"><button class="button button-primary" type="submit" data-label="Send volunteer interest">Send volunteer interest</button><div class="form-status"></div></div></form></div></section>
</main><div data-site-footer></div></body></html>
